# Trail Log map server: serves the map files, and holds a builder that makes them.
# Deploy in Coolify as a "Docker Compose" resource (see README.md).

services:
  tiles:
    image: protomaps/go-pmtiles:latest
    # Serves /data/roads.pmtiles at /roads/{z}/{x}/{y}.mvt and /data/imagery.pmtiles at /imagery/{z}/{x}/{y}.jpg
    command: ["serve", "/data", "--port=8080", "--cors=*", "--cache-size=256"]
    volumes:
      - mapdata:/data:ro
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    expose:
      - "8080"

  # Serves the map style (/style.json). The app's offline downloader needs it at a web address.
  # In Coolify give this service the domain http://YOUR-DOMAIN with the path /style.json on port 80.
  style:
    build:
      context: ./style
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    expose:
      - "80"

  # Live location sharing between friends (see README.md, "Live location sharing").
  # In Coolify give this service the same domain with the path /live on port 8090.
  live:
    build:
      context: ./live
    environment:
      # Where someone without the app lands when they tap a group link. Change it once the app id is final.
      - PLAY_URL=https://play.google.com/store/apps/details?id=com.aljarra.app
      # Lets group links open the app directly (Android App Links). Served at /.well-known/assetlinks.json.
      # Debug key + upload key for com.aljarra.app. plus the Play App Signing key (from Play Console).
      - 'ASSETLINKS=[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.aljarra.app","sha256_cert_fingerprints":["40:69:9B:76:CA:54:E0:09:41:08:A3:EF:26:99:9C:4A:A4:58:1D:A4:E2:B1:DE:65:62:9B:49:F6:48:D0:48:A8","A1:C5:38:C6:65:D3:11:68:22:17:B7:5B:D8:9A:06:E0:BE:ED:66:F8:53:8A:C2:50:52:A9:B8:CA:D9:7C:46:36","2A:3A:6B:CD:24:03:AD:92:C5:47:EC:1C:E3:D2:38:19:60:EB:7C:07:13:E5:C2:44:A9:CB:4A:09:61:CC:F8:AB"]}}]'
    volumes:
      - livedata:/livedata
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    expose:
      - "8090"

  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    # Idle until you open its terminal and start a build, so it uses almost nothing.
    volumes:
      - mapdata:/data
      - mapwork:/work
    restart: unless-stopped
    # Be polite on a shared server.
    mem_limit: 8g
    cpus: 6.0

volumes:
  mapdata:
  mapwork:
  livedata:
