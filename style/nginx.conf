server {
    listen 80;

    # Only the map style is served here. The map tiles come from the other service.
    # Coolify removes the "/style.json" part of the address before passing a request on,
    # so the style is served at both "/" and "/style.json".
    location = / {
        root /usr/share/nginx/html;
        try_files /style.json =404;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=300";
    }

    location = /style.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }
}
